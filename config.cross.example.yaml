# lighter-arb, cross mode: take both books wherever they cross by more than fees. Copy to config.yaml. Values written as
# $ {VAR} (no space) come from the environment. Nothing rests in this mode; every fill is a hedged pair, and the reverse
# cross unwinds it. Pick markets whose crosses come and go (bursts), not ones that sit crossed all night: a persistent
# cross is a basis, and this mode would buy it once up to the cap and then wait.
# Running this alongside a make-mode config at the same time needs a separate sub-account on each venue: positions,
# nonces and cancel-all are per account, and each process treats the other's positions as inherited and reduces them.

leverage: 3

venues:
  quote:
    base_url: https://mainnet.zklighter.elliot.ai
    account_index: ${LIGHTER_ACCOUNT_INDEX}
    api_key_index: 3
    api_key_private_key: ${LIGHTER_API_KEY}
    taker_fee_bps: 0            # what this account pays to take, from the venue's fee schedule: netted off the edge before a take
  hedge:
    base_url: https://api.rh.lighter.xyz
    account_index: ${RH_ACCOUNT_INDEX}
    api_key_index: 3
    api_key_private_key: ${RH_API_KEY}
    taker_fee_bps: 0

markets:
  AI: null                      # the value is the make-mode premium seed and is ignored here

strategy:
  mode: cross
  cross_min_edge_bps: 10        # take only where the books cross by at least this after both taker fees
  clip_usd: 500                 # most taken in one go, each side
  max_inventory_usd: 1500       # per market: a cross is taken only as far as this allows in its direction

drawdown_usd: 50
liq_buffer: 0.15
